name: task_ai1
description: "Notes-Tech - a private, offline-first notes app for Android and iOS."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3: 3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  cryptography: ^2.9.0
  record: ^7.1.2
  just_audio: ^0.10.6
  image_picker: ^1.2.4
  file_picker: ^13.3.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.1
  build_runner: 2.15.1

dependency_overrides:
  analyzer: 13.0.0
  source_gen: 4.2.4
  dart_style: 3.1.9

hooks:
  user_defines:
    sqlite3:
      source:
        windows: system
        default: source
      path: third_party/sqlite/sqlite3.c
      name_windows: winsqlite3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/img.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/img.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/img.png

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
