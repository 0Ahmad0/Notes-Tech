name: Build Split APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: ABI to build
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - arm64-v8a
          - all
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build split APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build x86_64 split
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.abi == 'x86_64' }}
        run: flutter build apk --release --split-per-abi --target-platform android-x64

      - name: Build arm64 split
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.abi == 'arm64-v8a' }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Build all ABI splits
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.abi == 'all' }}
        run: flutter build apk --release --split-per-abi

      - name: List built APKs
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Set artifact name
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=notes-tech-apk-${{ inputs.abi }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=notes-tech-apk-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
